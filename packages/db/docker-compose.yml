services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: storeforge
      POSTGRES_PASSWORD: storeforge
      POSTGRES_DB: storeforge_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeforge"]
      interval: 2s
      timeout: 2s
      retries: 20
