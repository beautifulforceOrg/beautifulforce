name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: storeforge
          POSTGRES_PASSWORD: storeforge
          POSTGRES_DB: storeforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storeforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint --filter=...[origin/main]
      - run: pnpm turbo run typecheck --filter=...[origin/main]
      - run: pnpm turbo run test --filter=...[origin/main]
      - run: pnpm turbo run test:e2e --filter=...[origin/main]

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
