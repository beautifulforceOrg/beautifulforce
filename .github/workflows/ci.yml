name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: storeforge
          POSTGRES_PASSWORD: storeforge
          POSTGRES_DB: storeforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storeforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # On a pull request, scope to what changed relative to the PR's base
      # branch so CI stays fast as more storefronts are added. On a direct
      # push to main, origin/main *is* the current commit -- filtering
      # against it would silently select nothing, so run everything instead.
      - name: Determine turbo filter
        id: turbo-filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "args=--filter=...[origin/${{ github.base_ref }}]" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm turbo run lint ${{ steps.turbo-filter.outputs.args }}
      - run: pnpm turbo run typecheck ${{ steps.turbo-filter.outputs.args }}
      - run: pnpm turbo run test ${{ steps.turbo-filter.outputs.args }}
      - run: pnpm turbo run test:e2e ${{ steps.turbo-filter.outputs.args }}

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds apps/mobile-template's iOS and Android preview binaries via EAS
  # Build's cloud service -- both platforms build on this same
  # ubuntu-latest runner, no macOS runner or local Xcode/Android Studio
  # needed. Only runs on a push to main (not every PR) to conserve EAS's
  # free build-minutes tier. Requires a free Expo account and an
  # EXPO_TOKEN repository secret, neither of which CI can provision on
  # its own -- see apps/mobile-template/README.md. Skips itself (without
  # failing) when that secret isn't set, so this job is a safe no-op in
  # any fork or before that one-time setup is done.
  mobile-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for EAS credentials
        id: eas-check
        run: echo "has_token=${{ secrets.EXPO_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: EAS build (preview, iOS + Android)
        if: steps.eas-check.outputs.has_token == 'true'
        working-directory: apps/mobile-template
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpm exec eas build --profile preview --platform all --non-interactive --no-wait

      - name: Skip notice
        if: steps.eas-check.outputs.has_token != 'true'
        run: |
          echo "::notice::Skipping EAS build -- EXPO_TOKEN repository secret is not set. See apps/mobile-template/README.md for one-time setup (free Expo account + eas init + access token)."
